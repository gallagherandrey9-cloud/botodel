<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена | БотоДел</title><meta name="robots" content="noindex">
<meta name="theme-color" content="#10151F">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(/fonts/inter-400.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url(/fonts/inter-600.woff) format("woff")}
@font-face{font-family:"Inter Display";font-weight:600;font-display:swap;src:url(/fonts/inter-display-600.woff) format("woff")}
:root{
  --night:#10151F;--panel:#18202C;--panel-2:#1E2836;--line:#273244;--text:#EEF1F5;--muted:#9BA6B6;
  --signal:#FFD54A;--signal-press:#F2C530;--on-signal:#10151F;--client:#2A3A55;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fd:"Inter Display","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-panel:14px;--r-btn:10px;--r-bubble:18px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --wrap:1160px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--night);color:var(--text);font:400 17px/1.6 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
a[href],button:not(:disabled),summary,label[for],select{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:calc(var(--wrap) + 40px);margin:0 auto;padding:0 20px}
@media(min-width:768px){.wrap{padding:0 32px;max-width:calc(var(--wrap) + 64px)}}
.h1,.h2,.h3{font-family:var(--fd);font-weight:600;letter-spacing:-.03em;line-height:1.05}
.h1{font-size:clamp(36px,6.4vw,64px)}
.h2{font-size:clamp(30px,4.6vw,44px);letter-spacing:-.025em;line-height:1.1}
.h3{font-size:clamp(22px,2.6vw,28px);letter-spacing:-.02em;line-height:1.2}
.lead{font-size:clamp(17px,1.9vw,19px);color:var(--muted);max-width:52ch}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.5}
.tnum{font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 20px;border-radius:var(--r-btn);font-weight:600;font-size:16px;line-height:1.2;text-decoration:none;text-align:center;border:1px solid transparent;transition:transform .12s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-signal{background:var(--signal);color:var(--on-signal)}
.btn-ghost{border-color:var(--line);color:var(--text);background:transparent}
.link{color:var(--text);text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:4px;text-decoration-thickness:1px;font-weight:600}
@media(hover:hover){
  .btn-signal:hover{background:var(--signal-press)}
  .btn-ghost:hover{border-color:var(--muted)}
  .link:hover{text-decoration-color:var(--signal)}
}
/* header */
.top{position:sticky;top:0;z-index:40;background:rgba(16,21,31,.94);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:64px}
.mark{font-family:var(--fd);font-weight:600;font-size:20px;letter-spacing:-.02em;text-decoration:none;display:inline-flex;align-items:center;gap:10px;min-height:44px}
.mark i{width:10px;height:10px;border-radius:50%;background:var(--signal);display:block}
.nav{display:none;gap:4px}
.nav a{color:var(--muted);text-decoration:none;font-size:15px;padding:10px 12px;border-radius:8px;transition:color .2s}
@media(hover:hover){.nav a:hover{color:var(--text)}}
@media(min-width:860px){.nav{display:flex}}
.top .btn{min-height:44px;padding:10px 16px;font-size:15px}
/* footer */
.foot{border-top:1px solid var(--line);padding:40px 0 48px;font-size:14px;color:var(--muted)}
.foot .wrap{display:grid;gap:20px}
@media(min-width:768px){.foot .wrap{grid-template-columns:1fr auto;align-items:end}}
.foot b{color:var(--text);font-weight:600}
.foot ul{display:flex;flex-wrap:wrap;gap:0 24px}
.foot ul a{display:inline-block;padding:12px 0;color:var(--muted);text-underline-offset:3px}
@media(hover:hover){.foot ul a:hover{color:var(--text)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.nf{min-height:calc(100dvh - 65px);display:flex;align-items:center;padding:48px 0}
.nf .h1{max-width:14ch;margin-bottom:16px}.nf .lead{margin-bottom:28px}
</style></head><body>
<header class="top"><div class="wrap"><a class="mark" href="/"><i aria-hidden="true"></i>БотоДел</a><a class="btn btn-signal" href="/#contact">Написать</a></div></header>
<main class="nf"><div class="wrap"><h1 class="h1">Такой страницы нет</h1><p class="lead">Возможно, в адресе опечатка или страницу переместили. На главной есть примеры работ, цены и контакты.</p><a class="btn btn-signal" href="/">Открыть главную</a></div></main>
</body></html>
