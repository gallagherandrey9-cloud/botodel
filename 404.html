<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена | БотоДел</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0C1A1F">
<style>
/* Tokens: primitive -> semantic */
:root{
  --c-ink:#0C1A1F; --c-ink-2:#142A31; --c-ink-3:#1D3840;
  --c-mist:#EEF1EF; --c-paper:#FFFFFF; --c-line:#D3DBD8;
  --c-text:#11201F; --c-muted:#566663;
  --c-brass:#D9B36A; --c-brass-deep:#9A7430; --c-sage:#86B3A5;
  --bg:var(--c-mist); --fg:var(--c-text); --fg-soft:var(--c-muted); --rule:var(--c-line);
  --on-dark:#EAF1EF; --on-dark-soft:#9FB4B0; --rule-dark:rgba(234,241,239,.16);
  --accent:var(--c-brass);
  --f-display:"Lora",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:48px;--s-8:72px;--s-9:112px;
  --r:6px; --wrap:1120px;
}
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(/fonts/inter-Regular.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url(/fonts/inter-Medium.woff) format("woff")}
@font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url(/fonts/inter-SemiBold.woff) format("woff")}
@font-face{font-family:"Lora";font-weight:400 700;font-style:normal;font-display:swap;src:url(/fonts/lora.woff) format("woff")}
@font-face{font-family:"Lora";font-weight:400 700;font-style:italic;font-display:swap;src:url(/fonts/lora-italic.woff) format("woff")}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--c-brass);outline-offset:3px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:calc(var(--wrap) + 48px);margin:0 auto;padding:0 24px}
.dark{background:var(--c-ink);color:var(--on-dark);--fg-soft:var(--on-dark-soft);--rule:var(--rule-dark)}
.paper{background:var(--c-paper)}
.sec{padding:var(--s-8) 0}
@media(min-width:900px){.sec{padding:var(--s-9) 0}}
.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.012em;line-height:1.1}
h2.display{font-size:clamp(30px,4.4vw,48px);max-width:18ch}
.lead{font-size:clamp(17px,2vw,20px);line-height:1.6;color:var(--fg-soft);max-width:56ch}
.small{font-size:14px;color:var(--fg-soft)}
.btn{text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 26px;border-radius:var(--r);border:1px solid transparent;font-weight:600;font-size:16px;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s}
.btn-primary{background:var(--c-brass);color:var(--c-ink)}
.btn-primary:hover{background:#E6C47F}
.btn-line{background:transparent;border-color:var(--rule-dark);color:var(--on-dark)}
.btn-line:hover{border-color:var(--c-brass);color:var(--c-brass)}
.light .btn-line,.btn-line.on-light{border-color:var(--rule);color:var(--fg)}
.btn-line.on-light:hover{border-color:var(--c-brass-deep);color:var(--c-brass-deep)}
.link{font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--c-brass);text-decoration-thickness:2px}
.link:hover{text-decoration-color:currentColor}
/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(12,26,31,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule-dark);color:var(--on-dark)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:24px}
.mark{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.01em;text-decoration:none}
.nav{display:none;gap:28px;font-size:15px}
.nav a{text-decoration:none;color:var(--on-dark-soft);transition:color .2s}
.nav a:hover{color:var(--on-dark)}
@media(min-width:860px){.nav{display:flex}}
.top .btn{min-height:40px;padding:8px 18px;font-size:14px}
/* footer */
.foot{padding:var(--s-7) 0;font-size:14px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between}
.foot a{color:var(--on-dark-soft);text-underline-offset:3px}
.foot a:hover{color:var(--on-dark)}
.foot ul{display:flex;gap:4px 20px;flex-wrap:wrap}.foot ul a{display:inline-block;padding:12px 0}
/* demo banner for example pages */
.demo-note{background:var(--c-ink);color:var(--on-dark-soft);font-size:12px;text-align:center;padding:8px 16px;border-bottom:1px solid var(--rule-dark)}
.demo-cta{background:var(--c-ink);color:var(--on-dark);padding:var(--s-7) 24px;text-align:left}
.demo-cta .in{max-width:var(--wrap);margin:0 auto;display:grid;gap:20px}
.demo-cta h3{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,3.4vw,34px);line-height:1.15;max-width:22ch}
.demo-cta p{color:var(--on-dark-soft);max-width:48ch}
.demo-cta .row{display:flex;gap:12px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.nf{min-height:calc(100vh - 64px);display:flex;align-items:center}
.nf h1{font-family:var(--f-display);font-weight:500;font-size:clamp(34px,6vw,56px);line-height:1.1;margin-bottom:16px;max-width:16ch}
.nf p{color:var(--on-dark-soft);max-width:44ch;margin-bottom:28px}
</style><!--HX--><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="referrer" content="strict-origin-when-cross-origin"><!--/HX-->
</head><body class="dark">
<header class="top"><div class="wrap"><a class="mark" href="/">БотоДел</a><a class="btn btn-primary" href="/#contact">Написать</a></div></header>
<main class="nf"><div class="wrap"><h1>Такой страницы нет</h1><p>Возможно, в адресе опечатка или страницу переместили. Откройте главную: там примеры работ, цены и контакты.</p><a class="btn btn-primary" href="/">На главную</a></div></main>
</body></html>
