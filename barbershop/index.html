<!DOCTYPE html>
<html lang="ru">
<head>

<style>
@font-face{font-family:"Golos Text";font-weight:400 700;font-display:swap;src:url(../fonts/golos-cyr.woff2) format("woff2");unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:"Golos Text";font-weight:400 700;font-display:swap;src:url(../fonts/golos-lat.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Dela Gothic One";font-weight:400;font-display:swap;src:url(../fonts/dela-cyr.woff2) format("woff2");unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:"Dela Gothic One";font-weight:400;font-display:swap;src:url(../fonts/dela-lat.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

:root{--theme:#17181A;--bg:#17181A;--card:#202124;--card-2:#28292D;--line:#34363B;--paper:#F1ECE4;--muted:#A8A297;--blood:#9E2B34;--blood-press:#86232B;--ok:#7FB08A;--err:#F08A8A;
--f:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--fd:"Dela Gothic One","Golos Text",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--paper);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0}
a[href],button:not(:disabled),label[for]{cursor:pointer}button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.demo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.demo a{color:var(--paper);text-underline-offset:3px;padding:12px 0;white-space:nowrap;display:inline-block}
.head{padding:20px 16px 8px;display:flex;align-items:flex-start;gap:12px}
.back{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);transition:opacity .2s,transform .12s var(--ease)}
.back:active{transform:scale(.95)}
.back[hidden]{display:none}
.brand{font-family:var(--fd);font-weight:400;font-size:24px;letter-spacing:.04em}
.addr{font-size:14px;color:var(--muted)}
.prog{display:flex;gap:6px;padding:12px 16px 0}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background-color .25s var(--ease)}
.prog i.on{background:var(--paper)}
.step-lbl{padding:14px 16px 0;font-size:14px;color:var(--muted)}
main{flex:1;padding:6px 16px 120px}
h1,h2{font-family:var(--fd);font-weight:400;letter-spacing:0;line-height:1.15}
h2{font-size:26px;margin:4px 0 18px}
.panel{animation:in .26s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
/* services */
.list{display:grid;gap:8px}
.opt{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 16px;text-align:left;padding:16px;border-radius:14px;background:var(--card);border:1.5px solid transparent;transition:border-color .2s,background-color .2s,transform .12s var(--ease)}
.opt:active{transform:scale(.985)}
.opt b{font-weight:600}
.opt .p{font-weight:600;text-align:right}
.opt small{color:var(--muted);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--paper);background:var(--card-2)}
/* masters */
.masters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{padding:16px 8px;border-radius:14px;background:var(--card);border:1.5px solid transparent;text-align:center;transition:border-color .2s,transform .12s var(--ease)}
.m:active{transform:scale(.97)}
.m[aria-pressed="true"]{border-color:var(--paper)}
.ini{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font:400 18px var(--fd);background:var(--card-2);border:1px solid var(--line)}
.m b{display:block;font-weight:600}
.m small{font-size:13px;color:var(--muted)}
.any{margin-top:8px}
/* days & slots */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.d{flex:none;width:60px;padding:10px 0;border-radius:12px;background:var(--card);text-align:center;border:1.5px solid transparent;transition:border-color .2s}
.d small{display:block;font-size:12px;color:var(--muted)}
.d b{font:400 20px var(--fd)}
.d[aria-pressed="true"]{border-color:var(--paper)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.s{min-height:44px;border-radius:10px;background:var(--card);font-weight:600;font-size:15px;border:1.5px solid transparent;transition:border-color .2s,transform .12s var(--ease)}
.s:active:not(:disabled){transform:scale(.96)}
.s:disabled{background:transparent;border:1px dashed var(--line);color:#6E6A63;text-decoration:line-through}
.s[aria-pressed="true"]{border-color:var(--paper);background:var(--card-2)}
.legend{margin-top:12px;font-size:13px;color:var(--muted)}
/* form */
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-size:14px;font-weight:600}
.field input{width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--paper)}
.field input[aria-invalid="true"]{border-color:var(--err)}
.err{font-size:14px;color:var(--err);min-height:0}
.err:empty{display:none}
.recap{padding:16px;border-radius:14px;background:var(--card);margin-bottom:20px;display:grid;gap:6px;font-size:15px}
.recap div{display:flex;justify-content:space-between;gap:16px}
.recap span{color:var(--muted)}
.consent{font-size:13px;color:var(--muted)}
/* done */
.done{text-align:left;padding-top:12px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--blood);display:grid;place-items:center;margin-bottom:20px;animation:pop .36s var(--ease) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.done h2{font-size:30px}
.owner{margin-top:20px;padding:14px 16px;border-radius:14px;border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.owner b{color:var(--paper)}
/* bottom main button */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.bar .in{max-width:448px;margin:0 auto}
.main-btn{width:100%;min-height:54px;border-radius:14px;background:var(--blood);color:#fff;font-weight:600;font-size:17px;transition:background-color .2s,transform .12s var(--ease),opacity .2s}
.main-btn:active:not(:disabled){transform:scale(.98)}
.main-btn:disabled{opacity:.45}
@media(hover:hover){.main-btn:hover:not(:disabled){background:var(--blood-press)}.opt:hover,.m:hover,.d:hover,.s:hover:not(:disabled){border-color:#5A5C62}}
.cta{margin:32px 0 0;padding:20px;border-radius:14px;border:1px solid var(--line)}
.cta p{color:var(--muted);font-size:15px;margin:6px 0 14px}
.cta a{display:inline-flex;min-height:44px;align-items:center;padding:10px 16px;border-radius:12px;background:var(--paper);color:var(--bg);font-weight:600;text-decoration:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="demo"><span>Учебный пример от БотоДел, данные выдуманы</span><a href="../#examples">Вернуться на сайт</a></div>
  <header class="head">
    <button class="back" id="back" type="button" aria-label="Назад" hidden><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5"/></svg></button>
    <div><h1 class="brand">BLACKLINE</h1><p class="addr">Барбершоп, ул. Примерная, 12. Ежедневно 10:00-21:00</p></div>
  </header>
  <div class="prog" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p class="step-lbl" id="step-lbl" aria-live="polite"></p>
  <main id="view"></main>
  <div class="bar"><div class="in"><button class="main-btn" id="main" type="button">Выбрать мастера</button></div></div>
</div>
<script>
(function(){
var S=[{id:'cut',t:'Мужская стрижка',d:'45 мин',p:1500},{id:'beard',t:'Борода и усы',d:'30 мин',p:900},{id:'combo',t:'Стрижка и борода',d:'75 мин',p:2200},{id:'kid',t:'Детская стрижка',d:'30 мин',p:1000},{id:'buzz',t:'Под машинку',d:'20 мин',p:700}];
var M=[{id:'a',n:'Артур',r:'Топ-барбер',i:'А'},{id:'d',n:'Денис',r:'Барбер',i:'Д'},{id:'k',n:'Кирилл',r:'Барбер',i:'К'}];
var TIMES=['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00'];
var st={step:0,svc:null,master:null,day:0,time:null,name:'',phone:''};
var view=document.getElementById('view'),main=document.getElementById('main'),back=document.getElementById('back'),lbl=document.getElementById('step-lbl'),bars=document.querySelectorAll('.prog i');
var LBL=['Шаг 1 из 4. Услуга','Шаг 2 из 4. Мастер','Шаг 3 из 4. Дата и время','Шаг 4 из 4. Контакты',''];
var BTN=['Выбрать мастера','Выбрать время','Указать контакты','Записаться',''];
function rub(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽'}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function day(o){var d=new Date();d.setDate(d.getDate()+o);return d}
var WD=['вс','пн','вт','ср','чт','пт','сб'],MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function busy(o,t){var h=parseInt(t,10);if(o===0){var now=new Date().getHours();if(h<=now)return true}return ((h*7+o*3+(st.master?st.master.charCodeAt(0):1))%5)===0}
function valid(){return [!!st.svc,!!st.master,!!st.time,true][st.step]}
function render(){
  bars.forEach(function(b,i){b.classList.toggle('on',i<=Math.min(st.step,3))});
  lbl.textContent=LBL[st.step];back.hidden=st.step===0||st.step===4;
  main.parentNode.parentNode.hidden=st.step===4;main.textContent=BTN[st.step];main.disabled=!valid();
  var h='';
  if(st.step===0){h='<h2>Что делаем?</h2><div class="list" role="group" aria-label="Услуги">'+S.map(function(s){return '<button type="button" class="opt" data-svc="'+s.id+'" aria-pressed="'+(st.svc===s.id)+'"><b>'+s.t+'</b><span class="p">'+rub(s.p)+'</span><small>'+s.d+'</small></button>'}).join('')+'</div>'}
  if(st.step===1){h='<h2>К кому записать?</h2><div class="masters" role="group" aria-label="Мастера">'+M.map(function(m){return '<button type="button" class="m" data-m="'+m.id+'" aria-pressed="'+(st.master===m.id)+'"><span class="ini" aria-hidden="true">'+m.i+'</span><b>'+m.n+'</b><small>'+m.r+'</small></button>'}).join('')+'</div><button type="button" class="opt any" data-m="any" aria-pressed="'+(st.master==='any')+'"><b>Любой свободный мастер</b><span></span><small>Подберём сами</small></button>'}
  if(st.step===2){var ds='';for(var o=0;o<10;o++){var d=day(o);ds+='<button type="button" class="d" data-day="'+o+'" aria-pressed="'+(st.day===o)+'" aria-label="'+d.getDate()+' '+MON[d.getMonth()]+'"><small>'+(o===0?'сег':o===1?'завт':WD[d.getDay()])+'</small><b>'+d.getDate()+'</b></button>'}
    var free=TIMES.filter(function(t){return !busy(st.day,t)});
    h='<h2>Когда удобно?</h2><div class="days" role="group" aria-label="День">'+ds+'</div>'+(free.length?'<div class="slots" role="group" aria-label="Время">'+TIMES.map(function(t){var b=busy(st.day,t);return '<button type="button" class="s" data-t="'+t+'"'+(b?' disabled aria-label="'+t+', занято"':'')+' aria-pressed="'+(st.time===t)+'">'+t+'</button>'}).join('')+'</div><p class="legend">Зачёркнутое время уже занято.</p>':'<p class="legend">На этот день всё занято. Выберите другой день.</p>')}
  if(st.step===3){var sv=S.filter(function(s){return s.id===st.svc})[0],ms=st.master==='any'?'Любой свободный':M.filter(function(m){return m.id===st.master})[0].n,dd=day(st.day);
    h='<h2>Как с вами связаться?</h2><div class="recap"><div><span>Услуга</span><b>'+sv.t+'</b></div><div><span>Мастер</span><b>'+ms+'</b></div><div><span>Когда</span><b>'+dd.getDate()+' '+MON[dd.getMonth()]+', '+st.time+'</b></div><div><span>Стоимость</span><b>'+rub(sv.p)+'</b></div></div>'+
    '<form id="form" novalidate><div class="field"><label for="nm">Имя</label><input id="nm" name="name" autocomplete="given-name" value="'+esc(st.name)+'" aria-describedby="nm-e"><p class="err" id="nm-e"></p></div>'+
    '<div class="field"><label for="ph">Телефон</label><input id="ph" name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 000-00-00" value="'+esc(st.phone)+'" aria-describedby="ph-e"><p class="err" id="ph-e"></p></div>'+
    '<p class="consent">Это пример: данные никуда не отправляются и не сохраняются.</p></form>'}
  if(st.step===4){var sv2=S.filter(function(s){return s.id===st.svc})[0],d2=day(st.day);
    h='<div class="done"><div class="tick" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15.5l5.5 5L23 9"/></svg></div><h2>Вы записаны, '+esc(st.name)+'</h2><p class="addr">'+sv2.t+', '+d2.getDate()+' '+MON[d2.getMonth()]+' в '+st.time+'. Напомним за час до визита.</p>'+
    '<div class="owner">В настоящем приложении владельцу сейчас пришло бы сообщение в Telegram: <b>«Новая запись: '+esc(st.name)+', '+sv2.t.toLowerCase()+', '+d2.getDate()+' '+MON[d2.getMonth()]+' '+st.time+'»</b></div>'+
    '<button type="button" class="opt any" id="again" style="margin-top:12px"><b>Записаться ещё раз</b><span></span><small>Начать заново</small></button>'+
    '<div class="cta"><b>Хотите такую запись для своих клиентов?</b><p>Сделаю под ваши услуги и мастеров за 3-4 дня. Первый пример бесплатно.</p><a href="../#contact">Обсудить такую запись</a></div></div>'}
  view.innerHTML='<div class="panel">'+h+'</div>';
}
view.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.svc){st.svc=b.dataset.svc;render();setTimeout(go,180)}
  else if(b.dataset.m){st.master=b.dataset.m;st.time=null;render();setTimeout(go,180)}
  else if(b.dataset.day){st.day=+b.dataset.day;st.time=null;render();view.querySelector('.d[aria-pressed="true"]').focus()}
  else if(b.dataset.t){st.time=b.dataset.t;render();var x=view.querySelector('.s[aria-pressed="true"]');x&&x.focus()}
  else if(b.id==='again'){st={step:0,svc:null,master:null,day:0,time:null,name:'',phone:''};render()}
});
function go(){if(!valid())return;st.step++;render();window.scrollTo(0,0)}
function submit(){
  var nm=document.getElementById('nm'),ph=document.getElementById('ph'),ok=true;st.name=nm.value.trim();st.phone=ph.value.trim();
  var digits=st.phone.replace(/\D/g,'');
  function set(inp,msg){inp.setAttribute('aria-invalid',msg?'true':'false');document.getElementById(inp.id+'-e').textContent=msg;if(msg&&ok){inp.focus();ok=false}}
  set(nm,st.name.length<2?'Напишите имя, чтобы мастер знал, как к вам обращаться.':'');
  set(ph,digits.length<10||digits.length>12?'Нужен телефон из 10-11 цифр, например +7 900 000-00-00.':'');
  if(ok){st.step=4;render();window.scrollTo(0,0);var h=view.querySelector('h2');h.setAttribute('tabindex','-1');h.focus()}
}
main.addEventListener('click',function(){st.step===3?submit():go()});
view.addEventListener('submit',function(e){e.preventDefault();submit()});
back.addEventListener('click',function(){if(st.step>0){if(st.step===3){var n=document.getElementById('nm');if(n){st.name=n.value;st.phone=document.getElementById('ph').value}}st.step--;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!back.hidden)back.click()});
render();
})();
</script>
</body>
</html>
